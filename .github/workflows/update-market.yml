name: 实时更新BTC-ETH价格

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行抓取脚本
        run: python scripts/update_live_price.py

      - name: 提交更新后的live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet live.json; then
            echo "价格没有变化，不需要提交。"
          else
            git add live.json
            git commit -m "自动更新实时价格"
            git push
          fi
